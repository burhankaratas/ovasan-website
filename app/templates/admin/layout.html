<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Paneli</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css"
      integrity="sha512-t7Few9xlddEmgd3oKZQahkNI4dS6l80+eGEzFQiqtyVYdvcSG2D3Iub77R20BdotfRPA9caaRkg1tyaJiPmO0g=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />

    {% block head %}

    {% endblock head %}
    <style>
    :root {
      --bg: #f8f9fa;
      --card: #ffffff;
      --accent: #0d6efd;
    }
    body { background: var(--bg); min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      height: 100vh;
      background: var(--card);
      padding: 1rem;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }
    .sidebar a {
      display: block;
      padding: 0.5rem 1rem;
      color: #333;
      border-radius: 6px;
      text-decoration: none;
      margin-bottom: 0.3rem;
      transition: all 0.2s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--accent);
      color: white;
    }

    /* Content */
    .content {
      padding: 2rem;
    }
    .card-header {
      font-weight: 600;
      background: var(--accent);
      color: white;
    }
    .btn-accent {
      background: var(--accent);
      color: white;
      border: 0;
    }

    @media (max-width: 768px) {
      .sidebar {
        height: auto;
        width: 100%;
        display: flex;
        overflow-x: auto;
      }
      .sidebar a { flex: 1; text-align: center; }
    }
  </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 sidebar">
          <a href="/admin/">Ana Sayfa</a>
          <a href="/admin/slider">Slider Görselleri</a>
          <a href="/admin/categories">Kategoriler</a>
          <a href="/admin/services">Hizmetler</a>
          <a href="/admin/career">Kariyer Başvuruları</a>
          <a href="/logout">Çıkış Yap</a>
        </nav>

        <!-- İçerik Alanı -->
        <div class="col-md-10 content">
          {% block body %}

          {% endblock body %}

          {% include 'includes/messages.html' %}
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
