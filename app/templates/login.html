<!doctype html>
<html lang="tr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <style>
    :root{
      --bg: #f6f7fb;
      --card: #ffffff;
      --accent: #0d6efd;
    }
    html,body{height:100%;background:var(--bg);}
    .login-card{
      width:100%;
      max-width:420px;
      border-radius:12px;
      box-shadow:0 6px 30px rgba(16,24,40,0.08);
      background:var(--card);
      padding:28px;
    }
    .brand{
      font-weight:600;
      letter-spacing:0.2px;
    }
    .form-label{font-size:0.9rem;font-weight:500}
    .btn-primary{background:var(--accent);border:0}
    .small-muted{color:#6b7280;font-size:0.85rem}
    @media (max-width:420px){
      .login-card{padding:20px;border-radius:10px}
    }
  </style>
    </head>
    <body>
        <div class="d-flex align-items-center justify-content-center"
            style="min-height:100vh;">
            <main class="login-card">
                <div class="mb-4 text-center">
                    <div class="brand fs-4">Ovasan Mühendislik</div>
                    <div class="small-muted">Hesabına giriş yap</div>
                </div>

                <form action="/login" method="post" autocomplete="on">
                    <div class="mb-3">
                        <label for="username" class="form-label">Kullanıcı
                            adı</label>
                        <input id="username" name="username" type="text"
                            class="form-control" placeholder="username"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Şifre</label>
                        <div class="input-group">
                            <input id="password" name="password" type="password"
                                class="form-control" placeholder="password"
                                required>
                            <button type="button"
                                class="btn btn-outline-secondary"
                                id="togglePwd">Göster</button>
                        </div>
                    </div>

                    <div class="g-recaptcha mb-3"
                        data-sitekey="{{ recaptcha_site_key }}"></div>

                    <div class="d-grid">
                        <button class="btn btn-primary btn-lg"
                            type="submit">Giriş yap</button>
                    </div>
                </form>
            </main>
        </div>

        <script>
    const pwd = document.getElementById('password');
    const toggle = document.getElementById('togglePwd');
    toggle.addEventListener('click', () => {
      if (pwd.type === 'password'){
        pwd.type = 'text';
        toggle.textContent = 'Gizle';
      } else {
        pwd.type = 'password';
        toggle.textContent = 'Göster';
      }
    });
  </script>

        {% include 'includes/messages.html' %}

        <!-- GEREKLİ CAPTCHA SCRIPTİ -->
        <script src="https://www.google.com/recaptcha/api.js" async
            defer></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
