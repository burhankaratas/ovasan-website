<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css"
      integrity="sha512-t7Few9xlddEmgd3oKZQahkNI4dS6l80+eGEzFQiqtyVYdvcSG2D3Iub77R20BdotfRPA9caaRkg1tyaJiPmO0g=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Spartan:wght@700&display=swap"
      rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    {% block head %}

    {% endblock head %}

    <style>
      .page-loader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.6s ease;
      }

      .page-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .page-loader__logo {
        width: 200px;
        height: auto;
        animation: loader-pulse 1.2s ease-in-out infinite;
      }

      @keyframes loader-pulse {
        0% { transform: scale(0.98); opacity: 0.8; }
        50% { transform: scale(1.02); opacity: 1; }
        100% { transform: scale(0.98); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div class="page-loader" id="pageLoader" aria-hidden="true">
      <img
        src="{{ url_for('static', filename='img/main/mainlogo.png') }}"
        alt="Ovasan logo"
        class="page-loader__logo" />
    </div>

    <div class="ortak">
      {% include 'includes/navbar.html' %}

      {% block body_ortak %}

      {% endblock body_ortak %}

    </div>

    {% block body %}

    {% endblock body %}

    {% include 'includes/messages.html' %}
    {% include 'includes/footer.html' %}

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"></script>
<script>
  window.addEventListener('load', function () {
    const loader = document.getElementById('pageLoader');
    if (!loader) return;

    // Minimum gösterim süresi
    const MIN_DURATION = 1000; // 1 saniye
    const startTime = performance.now();

    const hideLoader = () => {
      loader.classList.add('is-hidden');
      setTimeout(() => loader.remove(), 700);
    };

    const elapsed = performance.now() - startTime;
    const remaining = MIN_DURATION - elapsed;

    if (remaining > 0) {
      setTimeout(hideLoader, remaining);
    } else {
      hideLoader();
    }
  });
</script>

  </body>
</html>
